AXI_SLAVES:
  EXT_CLK:
    TCL_CALL:
      command: ADD_PL_CLK
      name: EXT
      freq: 50000000
      global_signal: true
      #add_rst_n: true
    SUB_SLAVES:
      AXI_CLK:
        TCL_CALL:
          command: ADD_PL_CLK
          name: AXI_MASTER
          freq: 100000000
          global_signal: true
          add_rst_n: true
        SUB_SLAVES:
          SYS_RESET:
            TCL_CALL:
              command: IP_SYS_RESET
              external_reset_n: ${::AXI_MASTER_RSTN}
              slowest_clk: ${::AXI_MASTER_CLK}
              # Experiment: do not gate reset deassertion on a clock-wizard lock.
              # Tie proc_sys_reset/dcm_locked high.
              dcm_locked: "1"
            SUB_SLAVES:
              # AXI4 domain interconnect (NOT connected to JTAG).
              # Driven by the full AXI4 C2C master (F1_C2C) via AXI_BUS_CTRL.
              CM_INTERCONNECT:
                TCL_CALL:
                  command: BUILD_ROOT_AXI_INTERCONNECT
                  axi_clk: ${::AXI_MASTER_CLK}
                  axi_rstn: "/SYS_RESET/interconnect_aresetn"
                  # Reset experiment:
                  # - Keep interconnect core + Sxx_ARESETN aligned to interconnect_aresetn
                  # - Drive Mxx_ARESETN from each slave's reset (peripheral_aresetn for peripherals)
                  force_all_aresetn: 0
                  force_s_aresetn: 1
                  force_m_aresetn: 0
                  # Interconnect optimization strategy (Vivado enum):
                  # 1=min area (legacy default), 2=max performance/bandwidth
                  # Required for non-default XBAR widths.
                  enable_advanced_options: 1
                  # Optimization experiment: widen internal crossbar datapath.
                  # This is being forced for debugging/bring-up testing.
                  xbar_data_width: 128

                  # Workaround: in some Vivado/IP-integrator builds, a 1x1
                  # axi_interconnect can keep default (32-bit) SI/MI widths even
                  # when connected to 64-bit endpoints, which then forces the
                  # internally-generated per-SI data FIFO to 32-bit.
                  # Explicitly request 64-bit port widths.
                  si_data_width_map:
                    S00: 128
                  mi_data_width_map:
                    M00: 128
                  # Keep strategy explicit/deterministic; avoid STRATEGY=2 which broke link bring-up.
                  strategy: 2

                  # Deep FIFO experiment (best-effort, Vivado-version dependent):
                  # - Enables per-port data FIFOs and requests a deeper FIFO depth when supported.
                  # - If a given port/property doesn't exist, the Tcl layer applies this best-effort
                  #   (caught/ignored) so it's safe across varying interconnect sizes.
                  #
                  # NOTE: Keys are interconnect interface names (M00, M01, ... / S00, S01, ...).
                  # Current test design only exposes M00 on CM_INTERCONNECT.
                  si_has_data_fifo_map:
                    # Note: on axi_interconnect:2.1, HAS_DATA_FIFO is often an enum (0/1/2)
                    # where >1 selects "deeper" FIFO modes (e.g. 512 deep packet mode).
                    # If Vivado rejects the enum on this build, the Tcl layer will fall back to 1.
                    S00: 2
                  mi_has_data_fifo_map:
                    # In a 1x1 interconnect (NUM_SI=1, NUM_MI=1), some Vivado builds appear to
                    # disable/ignore certain M00 interface options (GUI hides the Master Interfaces
                    # tab; Tcl set_property may be ignored). Keep this set so it takes effect if/when
                    # the parameter is enabled, but rely primarily on the S00 FIFO in this topology.
                    M00: 2

              JTAG_AXI_MASTER:
                TCL_CALL:
                  command: BUILD_JTAG_AXI_MASTER
                  axi_clk: ${::AXI_MASTER_CLK}
                  # Keep JTAG master reset aligned to the peripheral reset domain.
                  axi_rstn: "/SYS_RESET/peripheral_aresetn"
                SUB_SLAVES:
                  # AXI-Lite domain interconnect.
                  # For now, connect the JTAG master here (and keep it separate from CM_INTERCONNECT).
                  CM_AXI_LITE_INTERCONNECT:
                    TCL_CALL:
                      command: BUILD_CHILD_AXI_INTERCONNECT
                      axi_clk: ${::AXI_MASTER_CLK}
                      axi_rstn: "/SYS_RESET/interconnect_aresetn"
                      # Reset experiment:
                      # - Keep interconnect core + Sxx_ARESETN aligned to interconnect_aresetn
                      # - Drive Mxx_ARESETN from each slave's reset (peripheral_aresetn for peripherals)
                      force_all_aresetn: 0
                      force_s_aresetn: 1
                      force_m_aresetn: 0
                      strategy: 1
                      parent:
                        - JTAG_AXI_MASTER/M_AXI
                      master_clk:
                        - ${::AXI_MASTER_CLK}
                      master_rstn:
                        - "/SYS_RESET/interconnect_aresetn"

CORES:
  onboardclk:
    TCL_CALL:
      command: IP_CORE_ClockWizard
      in_clk_type: Differential_clock_capable_pin
      in_clk_freq_MHZ: 200.000
      out_clks:
        1: 200.000
        2: 50.000
