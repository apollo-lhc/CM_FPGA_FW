AXI_SLAVES:
  F1_C2C:
    TCL_CALL:
      command: AXI_IP_C2C
      axi_control: ${::AXI_BUS_CTRL}
      axi_data_width: 64
      gearbox_enable: 1
      # CM fabric side (SI): 128-bit @ 100MHz
      # C2C side (MI): 64-bit @ 200MHz
      gearbox_si_data_width: 128
      gearbox_mi_data_width: 64
      gearbox_clkout_mhz: 200.0
      gearbox_clk_wiz_name: c2c_clk_wiz_100to200
      gearbox_rst_name: c2c_sys_resetter_200
      gearbox_external_reset_n: ${::AXI_MASTER_RSTN}
      aurora_lanes: 1
      enforce_aurora_width_match: 0
      primary_serdes: 1
      init_clk: ${::EXT_CLK}
      refclk_freq: 200
      c2c_master: false
      speed: 8
      # Force per-channel CPLL to avoid shared GTYE4_COMMON/QPLL resources.
      gt_pll: cpll
      singleend_refclk: True
      addr: ${::AXI_BUS_CTRL}
  F1_C2CB:
    TCL_CALL:
      command: AXI_IP_C2C
      axi_control: ${::AXI_BUS_CTRL}
      axi_data_width: 32
      aurora_lanes: 1
      # At 8 Gbps we want each link to be its own primary SERDES so it has its own CPLL.
      primary_serdes: 1
      init_clk: ${::EXT_CLK}
      refclk_freq: 200
      c2c_master: false
      speed: 8
      gt_pll: cpll
      singleend_refclk: True
      addr_lite: ${::AXI_BUS_CTRL}
  F1_C2C_INTF:
    TCL_CALL: 
      command: AXI_PL_DEV_CONNECT
      axi_control: "${::AXILITE_ENDPOINT_CTRL}"
      addr:
        offset: "-1"
        range: "64K"
      remote_slave: "1"
    XML: "address_table/modules/C2C_INTFS_CornellRev2.xml"
    UHAL_BASE: "auto"
    HDL: 
      out_name: "C2C_INTF"
      map_template: "axi_generic/template_map_withbram.vhd"
    SUB_SLAVES:
      CM1_PB_UART:
        TCL_CALL:
          command: "AXI_IP_UART"
          addr:
            offset: "-1"
            range: "4K"
          irq_port: "F1_C2CB/axi_c2c_s2m_intr_in"
          baud_rate: "115200"  
          axi_control: "${::AXILITE_ENDPOINT_CTRL}"
          manual_load_dtsi: "1"
          remote_slave: "1"
          dt_data: "compatible = \"xlnx,axi-uartlite-2.0\", \"xlnx,xps-uartlite-1.00.a\";current-speed = <115200>;device_type = \"serial\";interrupt-names = \"interrupt\";interrupt-parent = <&IRQ0_INTR_CTRL>;interrupts = <4 0>;port-number = <101>;xlnx,baudrate = <0x1c200>;xlnx,data-bits = <0x8>;xlnx,odd-parity = <0x0>;xlnx,s-axi-aclk-freq-hz-d = \"49.9995\";xlnx,use-parity = <0x0>;"
