AXI_SLAVES:
  F1_C2C:
    TCL_CALL:
      command: AXI_IP_C2C
      axi_control: ${::AXI_BUS_CTRL}
      axi_data_width: 64
      aurora_lanes: 1
      enforce_aurora_width_match: 0
      primary_serdes: 1
      init_clk: ${::EXT_CLK}
      refclk_freq: 200
      c2c_master: false
      speed: 10
      # Optional transceiver PLL/common selection (Vivado/IP dependent; best-effort):
      #   gt_pll: auto|cpll|qpll|qpll0|qpll1
      #   gt_qpll_index: 0|1
      #   gt_locate_common: auto|core|example_design
      #
      # NOTE: If TCDS2 already instantiates the GTYE4_COMMON in this quad, setting
      # gt_locate_common: core on C2C may conflict. Use these knobs carefully.
      # 10G generally implies QPLL usage on GTYE4. We also proved the TCDS2 relay in this
      # quad has QPLL0 enabled and QPLL1 powered down, so prefer QPLL0 for C2C to avoid
      # any accidental QPLL1 selection.
      gt_pll: qpll0
      gt_qpll_index: 0
      gt_locate_common: auto

      # Explicit GT channel placement is required here:
      # Aurora may emit fixed LOC constraints in its generated *_gt.xdc, and without steering
      # multiple links can default to the same channel (e.g. X1Y0) causing an impl-time BEL
      # constraint conflict.
      gt_channel_enable: X1Y0
      gt_steering_mode: minimal_non_primary
      singleend_refclk: True
      addr: ${::AXI_BUS_CTRL}
  F1_C2CB:
    TCL_CALL:
      command: AXI_IP_C2C
      axi_control: ${::AXILITE_ENDPOINT_CTRL}
      axi_data_width: 32
      aurora_lanes: 1
      # F1_C2CB sits in the same GT quad/clock region as F1_C2C (X1Y1 vs X1Y0),
      # so it must reuse the primary serdes resources (GT common/QPLL, user clock).
      primary_serdes: F1_C2C_PHY
      init_clk: ${::EXT_CLK}
      refclk_freq: 200
      c2c_master: false
      speed: 10
      # Optional transceiver PLL/common selection (Vivado/IP dependent; best-effort):
      #   gt_pll: auto|cpll|qpll|qpll0|qpll1
      #   gt_qpll_index: 0|1
      #   gt_locate_common: auto|core|example_design
      gt_pll: qpll0
      gt_qpll_index: 0
      gt_locate_common: auto

      # This link shares the primary SERDES resources via primary_serdes: F1_C2C_PHY,
      # but must still select a distinct GT channel within the quad.
      gt_channel_enable: X1Y1
      gt_steering_mode: minimal_non_primary
      singleend_refclk: True
      addr_lite: ${::AXILITE_ENDPOINT_CTRL}
  F1_C2C_INTF:
    TCL_CALL: 
      command: AXI_PL_DEV_CONNECT
      axi_control: "${::AXILITE_ENDPOINT_CTRL}"
      addr:
        offset: "-1"
        range: "64K"
      remote_slave: "1"
    XML: "address_table/modules/C2C_INTFS_CornellRev2.xml"
    UHAL_BASE: "auto"
    HDL: 
      out_name: "C2C_INTF"
      map_template: "axi_generic/template_map_withbram.vhd"
    SUB_SLAVES:
      CM1_PB_UART:
        TCL_CALL:
          command: "AXI_IP_UART"
          addr:
            offset: "-1"
            range: "4K"
          irq_port: "F1_C2CB/axi_c2c_s2m_intr_in"
          baud_rate: "115200"  
          axi_control: "${::AXILITE_ENDPOINT_CTRL}"
          manual_load_dtsi: "1"
          remote_slave: "1"
          dt_data: "compatible = \"xlnx,axi-uartlite-2.0\", \"xlnx,xps-uartlite-1.00.a\";current-speed = <115200>;device_type = \"serial\";interrupt-names = \"interrupt\";interrupt-parent = <&IRQ0_INTR_CTRL>;interrupts = <4 0>;port-number = <101>;xlnx,baudrate = <0x1c200>;xlnx,data-bits = <0x8>;xlnx,odd-parity = <0x0>;xlnx,s-axi-aclk-freq-hz-d = \"49.9995\";xlnx,use-parity = <0x0>;"
