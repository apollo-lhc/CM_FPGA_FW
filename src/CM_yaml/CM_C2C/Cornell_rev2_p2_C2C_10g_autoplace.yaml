AXI_SLAVES:
  F2_C2C:
    TCL_CALL:
      command: AXI_IP_C2C
      axi_control: ${::AXI_BUS_CTRL}
      axi_data_width: 64
      gearbox_enable: 1
      # CM fabric side (SI): 128-bit @ 100MHz
      # C2C side (MI): 64-bit @ 200MHz
      gearbox_si_data_width: 128
      gearbox_mi_data_width: 64
      gearbox_clkout_mhz: 200.0
      gearbox_clk_wiz_name: c2c_clk_wiz_100to200
      gearbox_rst_name: c2c_sys_resetter_200
      primary_serdes: 1
      init_clk: ${::EXT_CLK}
      refclk_freq: 200
      c2c_master: false
      speed: 10
      # Optional transceiver PLL/common selection (Vivado/IP dependent; best-effort):
      #   gt_pll: auto|cpll|qpll|qpll0|qpll1
      #   gt_qpll_index: 0|1
      #   gt_locate_common: auto|core|example_design
      #
      # IMPORTANT (P2): The TTC/TCDS2 relay also uses GTY resources in this quad and
      # instantiates the GTYE4_COMMON. To avoid a second GTYE4_COMMON competing for the
      # same quad common site (which can trigger [Place 30-738]), request CPLL for C2C.
      gt_pll: cpll
      # If you later need to fall back to QPLL mode, prefer QPLL0 to match the relay's
      # proven configuration (QPLL0 enabled, QPLL1 powered down) and to avoid accidental
      # QPLL1 selection.
      # Explicit GT channel placement is required here:
      # Aurora may emit fixed LOC constraints in its generated *_gt.xdc, and without steering
      # multiple links can default to the same channel causing impl-time BEL conflicts.
      #
      # NOTE: Some Vivado/IP combinations reject steering during validation with
      # "TX/RX_REFCLK_SOURCE ... not enabled". The BD Tcl wrapper will automatically retry
      # without steering in that case, so keeping these hints here is safe.
      singleend_refclk: True
      addr: ${::AXI_BUS_CTRL}
  F2_C2CB:
    TCL_CALL:
      command: AXI_IP_C2C
      axi_control: ${::AXILITE_ENDPOINT_CTRL}
      axi_data_width: 32
      # F2_C2CB sits in the same GT quad/clock region as F2_C2C (X1Y1 vs X1Y0),
      # so it must reuse the primary serdes resources (GT common/QPLL, user clock).
      primary_serdes: F2_C2C_PHY
      init_clk: ${::EXT_CLK}
      refclk_freq: 200
      c2c_master: false
      speed: 10
      # Optional transceiver PLL/common selection (Vivado/IP dependent; best-effort):
      #   gt_pll: auto|cpll|qpll|qpll0|qpll1
      #   gt_qpll_index: 0|1
      #   gt_locate_common: auto|core|example_design
      gt_pll: cpll
      singleend_refclk: True
      addr_lite: ${::AXILITE_ENDPOINT_CTRL}
  F2_C2C_INTF:
    TCL_CALL: 
      command: AXI_PL_DEV_CONNECT
      axi_control: "${::AXILITE_ENDPOINT_CTRL}"
      addr:
        offset: "-1"
        range: "64K"
      remote_slave: "1"
    XML: "address_table/modules/C2C_INTFS_CornellRev2.xml"
    UHAL_BASE: "auto"
    HDL: 
      out_name: "C2C_INTF"
      map_template: "axi_generic/template_map_withbram.vhd"
    SUB_SLAVES:
      CM1_PB_UART:
        TCL_CALL:
          command: "AXI_IP_UART"
          addr:
            offset: "-1"
            range: "4K"
          irq_port: "F2_C2CB/axi_c2c_s2m_intr_in"
          baud_rate: "115200"  
          axi_control: "${::AXILITE_ENDPOINT_CTRL}"
          manual_load_dtsi: "1"
          remote_slave: "1"
          dt_data: "compatible = \"xlnx,axi-uartlite-2.0\", \"xlnx,xps-uartlite-1.00.a\";current-speed = <115200>;device_type = \"serial\";interrupt-names = \"interrupt\";interrupt-parent = <&IRQ0_INTR_CTRL>;interrupts = <4 0>;port-number = <101>;xlnx,baudrate = <0x1c200>;xlnx,data-bits = <0x8>;xlnx,odd-parity = <0x0>;xlnx,s-axi-aclk-freq-hz-d = \"49.9995\";xlnx,use-parity = <0x0>;"
