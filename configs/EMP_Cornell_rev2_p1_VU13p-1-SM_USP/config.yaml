AXI_CONTROL_SETS:
  INCLUDE_FILE:  ${::apollo_root_path}/src/CM_yaml/CM1_base.yaml

  # When bypassing the AXI4 interconnect and hanging an external slave directly off
  # a C2C M_AXI, keep the endpoint reset aligned with the C2C bus reset. Otherwise
  # the C2C master/link handler can start transactions while the slave is still held
  # in peripheral reset, leading to stalls/timeouts.
  AXI_ENDPOINT_BUSRST_CTRL:
    axi_clk: "${::AXI_MASTER_CLK}"
    axi_rstn: "/SYS_RESET_BUS_RST_N/Res"
    axi_freq: "${::AXI_MASTER_CLK_FREQ}"
    allocator:
      # Reuse the allocator created by AXI_ENDPOINT_CTRL from CM1_base.yaml.
      BT_name: "AXI_ENDPOINT_CTRL_BT"

  # Route AXI-Lite endpoints via a separate AXI-Lite-only interconnect domain.
  AXILITE_ENDPOINT_CTRL:
    axi_interconnect: "${::CM_AXI_LITE_INTERCONNECT}"
    axi_clk: "${::AXI_MASTER_CLK}"
    axi_rstn: "/SYS_RESET/peripheral_aresetn"
    axi_freq: "${::AXI_MASTER_CLK_FREQ}"
    allocator:
      starting_address: 0xB1000000
      size: 0x00800000
      block_size: 4K

  # Ensure the AXI-Lite C2C master (F1_C2CB) drives the AXI-Lite-only interconnect.
  AXI_BUS_LITE_CTRL:
    axi_interconnect: "${::CM_AXI_LITE_INTERCONNECT}"
    axi_clk: "${::AXI_MASTER_CLK}"
    axi_rstn: "/SYS_RESET_BUS_RST_N/Res"
    axi_freq: "${::AXI_MASTER_CLK_FREQ}"
    axi_base: 0xB0000000

AXI_SLAVES:
  BASE:
    INCLUDE_FILE: ${::apollo_root_path}/src/CM_yaml/EMP_base.yaml
    SUB_SLAVES:
      C2C:
        INCLUDE_FILE: ${::apollo_root_path}/src/CM_yaml/CM_C2C/Cornell_rev2_p1_C2C_8g_bypass_axi4_interconnect.yaml

      F1_IPBUS:
        TCL_CALL:
          command: AXI_PL_DEV_DIRECT_CONNECT
          axi_control: "${::AXI_ENDPOINT_BUSRST_CTRL}"
          axi_master_intf: "F1_C2C/m_axi"
          type: "AXI4"
          addr:
            offset: "-1"
            range:  "8M"
          data_width: "64"
          remote_slave: "1"
        XML: "address_table/modules/IPBUS.xml"
        UHAL_BASE: "auto"
      F1_IO:
        TCL_CALL: 
          command: AXI_PL_DEV_CONNECT
          axi_control: "${::AXILITE_ENDPOINT_CTRL}"
          addr:
            offset: "-1"
            range: "4K"
          remote_slave: "1"
        XML: "address_table/modules/CM_IO_EMP.xml"
        UHAL_BASE: "auto"
        HDL: 
          out_name: "IO"
          map_template: "axi_generic/template_map_withbram.vhd"
      F1_CM_FW_INFO:
        TCL_CALL:
          command: AXI_PL_DEV_CONNECT 
          axi_control: "${::AXILITE_ENDPOINT_CTRL}"
          addr:
            offset: "-1"
            range: "4K"
          remote_slave: "1"
        XML: "address_table/modules/FW_INFO.xml"
        UHAL_BASE: "auto"
        HDL: 
          out_name: "CM_FW_INFO"
          map_template: "axi_generic/template_map.vhd"
